# ===== Khong hardcode secret. Tat ca lay tu bien moi truong. =====
spring.application.name=certificate-backend
server.port=${SERVER_PORT:5000}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# local: update de tien demo. production nen chuyen sang Flyway/Liquibase + validate.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

server.forward-headers-strategy=framework

# ===== Web3j / Sepolia =====
# Neu bo trong: blockchain bi vo hieu hoa co kiem soat (khong dung private key gia), goi API se tra loi 503 ro rang.
web3.rpc-url=${SEPOLIA_RPC_URL:}
web3.contract-address=${CONTRACT_ADDRESS:}
web3.private-key=${SERVER_WALLET_PRIVATE_KEY:}
web3.chain-id=${SEPOLIA_CHAIN_ID:11155111}

# ===== JWT =====
jwt.secret=${JWT_SECRET:}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
jwt.issuer=ctut-certificate-backend

# ===== Nonce / SIWE-like =====
auth.nonce-ttl-minutes=${NONCE_TTL_MINUTES:5}
auth.domain=${AUTH_DOMAIN:localhost}

# ===== CORS =====
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===== Demo seed (khong dua dia chi that vao source, chi bien moi truong) =====
demo.admin-wallet=${DEMO_ADMIN_WALLET:}
demo.issuer-wallet=${DEMO_ISSUER_WALLET:}
demo.student-wallet=${DEMO_STUDENT_WALLET:}
demo.student-id=${DEMO_STUDENT_ID:}
demo.admin-name=${DEMO_ADMIN_NAME:Admin Demo}
demo.issuer-name=${DEMO_ISSUER_NAME:Can bo dao tao Demo}
demo.student-name=${DEMO_STUDENT_NAME:Sinh vien Demo}

springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
